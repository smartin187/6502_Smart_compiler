name: Build all

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build_linux_amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Linux amd64 (x64)
        run: |
          ./build_releases/build_linux/build_all_linux.bash no_other_arch

      - name: Publish GitHub Release - Linux x64
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_publish/linux/amd64/*.deb
            build_publish/linux/amd64/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  build_linux_arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Linux arm64
        run: |
          ./build_releases/build_linux/build_all_linux.bash no_other_arch

      - name: Publish GitHub Release - Linux arm64
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_publish/linux/arm64/*.deb
            build_publish/linux/arm64/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: false